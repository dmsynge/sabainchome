<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/apple-touch-icon.png" />
		<script>
			// Send first-time visitors to the Japanese site if their browser prefers
			// Japanese. A `lang` cookie (set by the language switcher) wins over the
			// browser setting. Explicit /ja/ URLs are always left alone.
			(function () {
				try {
					var path = location.pathname;
					if (/^\/ja(\/|$)/.test(path)) return;
					var cookie = document.cookie.match(/(?:^|;\s*)lang=(en|ja)(?:;|$)/);
					var lang = cookie && cookie[1];
					if (!lang) {
						var prefs = navigator.languages || [navigator.language || ''];
						for (var i = 0; i < prefs.length && !lang; i++) {
							var tag = String(prefs[i]).toLowerCase();
							if (tag.indexOf('ja') === 0) lang = 'ja';
							else if (tag.indexOf('en') === 0) lang = 'en';
						}
					}
					if (lang === 'ja') location.replace('/ja' + path + location.search + location.hash);
				} catch (e) {}
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
